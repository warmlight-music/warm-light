<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warm Light / Тёплый свет</title>
<style>
  :root{
    --bg:#1a120b; --bg2:#2a1d12; --card:#2e2015;
    --accent:#f0a04b; --accent2:#e07a3f; --text:#fdf6ec;
    --muted:#c9b8a3; --glow:rgba(240,160,75,.35);
  }
  body.theme-rain {
    --bg:#0f141a; --bg2:#1c2633; --card:#222f3e;
    --accent:#4fa4f0; --accent2:#3f78e0; --text:#f0f4f8;
    --muted:#8a9fb5; --glow:rgba(79,164,240,.3);
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 0%,var(--bg2) 0%,var(--bg) 65%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
    transition: background 0.5s ease, color 0.5s ease;
  }
  .top-bar { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
  .albums-nav { display: flex; gap: 10px; justify-content: center; background: var(--card); padding: 6px; border-radius: 16px; border: 1px solid rgba(240,160,75,.15); transition: background 0.5s ease; }
  .albums-nav button { flex: 1; background: transparent; border: none; color: var(--muted); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all .3s ease; }
  .albums-nav button.active { background: rgba(255,255,255,.08); color: var(--accent); }
  .lang { align-self:flex-end; display:flex; gap:6px; background:var(--card); padding:4px; border-radius:999px; border:1px solid rgba(240,160,75,.25); transition: background 0.5s ease; }
  .lang button { background:transparent; border:none; color:var(--muted); padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; transition:all .3s ease; }
  .lang button.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0f141a; box-shadow:0 4px 14px var(--glow); }
  
  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:22px; object-fit:cover; box-shadow:0 24px 70px var(--glow); border:2px solid rgba(240,160,75,.3); pointer-events: none; transition: box-shadow 0.5s ease, border-color 0.5s ease; }
  .album__title { font-size:clamp(28px,6vw,48px); font-weight:800; letter-spacing:-.02em; background:linear-gradient(135deg, var(--text), var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; line-height:1.1; transition: background 0.5s ease; }
  .album__sub { color:var(--muted); font-size:16px; font-style:italic; transition: color 0.5s ease; }
  
  .carousel { width:100%; max-width:960px; display:flex; gap:18px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:8px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; transition: background 0.5s ease; }
  .track { flex:0 0 auto; width:170px; scroll-snap-align:center; background:var(--card); border-radius:18px; padding:10px; cursor:pointer; transition:transform .2s, box-shadow .2s, border-color .2s, background 0.5s ease; border:2px solid transparent; text-align:center; }
  .track:hover { transform:translateY(-6px); }
  .track.active { border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,255,255,.1), 0 12px 30px var(--glow); }
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:12px; object-fit:cover; display:block; margin-bottom:10px; background:var(--bg2); pointer-events: none; }
  .track__num { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:.08em; margin-bottom:2px; transition: color 0.5s ease; }
  .track__name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  
  .player { width:100%; max-width:600px; background:var(--card); border-radius:22px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 12px 40px rgba(0,0,0,.45); border:1px solid rgba(240,160,75,.15); transition: background 0.5s ease, border-color 0.5s ease; }
  .player__now { display:flex; align-items:center; gap:14px; }
  .player__cover { width:68px; height:68px; border-radius:14px; object-fit:cover; background:var(--bg2); border:1px solid rgba(240,160,75,.25); pointer-events: none; transition: border-color 0.5s ease; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:700; font-size:15px; line-height:1.25; margin-bottom:2px; }
  .player__title .lang-sub { color:var(--accent); font-size:12px; display:block; font-weight:600; transition: color 0.5s ease; }
  .player__artist { color:var(--muted); font-size:13px; transition: color 0.5s ease; }
  .player audio { width:100%; outline: none; }
  .player__nav { display:flex; justify-content:center; gap:12px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#0f141a; padding:10px 22px; border-radius:12px; font-weight:700; cursor:pointer; transition:filter .15s, background 0.5s ease; }
  .player__nav button:hover { filter:brightness(1.1); }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="lang" role="group" aria-label="Language">
      <button id="btnRu">RU</button>
      <button id="btnEn" class="active">EN</button>
    </div>
    <div class="albums-nav" id="albumsNav">
      <button class="active" data-album="0">Warm Light</button>
      <button data-album="1">After the Rain</button>
    </div>
  </div>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover-1.jpg" alt="Album Cover">
    <h1 class="album__title" id="albumTitle">Warm Light</h1>
    <p class="album__sub" id="albumSub">Тёплый свет</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover-1.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Pick a song</div>
        <div class="player__artist" id="playerArtist">Warm Light / Тёплый свет</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Prev</button>
      <button id="nextBtn">Next ⏭</button>
    </div>
  </div>

<script>
  // ТОЧНЫЕ ID файлов для каждого трека (16 для EN и 16 для RU)
  const fileIds = {
    en: [
      "34473192", "34473193", "34473195", // en-01, en-02, en-03
      "34473138", "34473141", "34473143", "34473148", "34473154", // en-04 по en-08
      "34473156", "34473159", "34473166", "34473169", "34473173", // en-09 по en-13
      "34473180", "34473187", "34473190"  // en-14 по en-16
    ],
    ru: [
      "34473248", "34473250", "34473256", "34473258", // ru-01 по ru-04
      "34473222", "34473223", "34473224", "34473227", // ru-05 по ru-08
      "34473231", "34473236", "34473239", "34473240", // ru-09 по ru-12
      "34473243", "34473244", "34473245", "34473247"  // ru-13 по ru-16
    ]
  };

  const albums = [
    {
      id: 0, titleRu: "Тёплый свет", titleEn: "Warm Light", cover: "cover-1.jpg", theme: "",
      tracks: [
        { ru:"Когда город спит",          en:"When the City Sleeps" },
        { ru:"Ещё одно лето",              en:"One More Summer" },
        { ru:"Письмо, что я не отправила", en:"The Letter I Never Sent" },
        { ru:"Танцы на кухне",             en:"Dancing in the Kitchen" },
        { ru:"Держись за свет",            en:"Hold On to the Light" },
        { ru:"Песня в дорогу",             en:"A Song for the Road" },
        { ru:"Когда наступит утро",        en:"When the Morning Comes" },
        { ru:"Нажми на плей",              en:"Just Press Play" },
      ]
    },
    {
      id: 1, titleRu: "После дождя", titleEn: "After the Rain", cover: "cover-2.jpg", theme: "theme-rain",
      tracks: [
        { ru:"Ты ещё моя",                 en:"You're Still Mine" },
        { ru:"Осень — это любовь",         en:"Autumn Is Love" },
        { ru:"Каждый день",                en:"Every Day" },
        { ru:"Души притяженье",            en:"Soul Attraction" },
        { ru:"Тепло — это ты",             en:"Warmth Is You" },
        { ru:"Мой причал",                 en:"My Harbor" },
        { ru:"Чудо свершится",             en:"A Miracle Will Happen" },
        { ru:"Ты — это счастье",           en:"You Are the Happiness" },
      ]
    }
  ];

  let currentAlbumIndex = 0;
  let lang = 'en';
  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist= document.getElementById('playerArtist');
  const albumCover  = document.getElementById('albumCover');
  const albumTitle  = document.getElementById('albumTitle');
  const albumSub    = document.getElementById('albumSub');
  const btnRu       = document.getElementById('btnRu');
  const btnEn       = document.getElementById('btnEn');
  const albumsNav   = document.getElementById('albumsNav');

  const getAlbum = () => albums[currentAlbumIndex];
  const pad = (n) => String(n+1).padStart(2,'0');
  
  const songPath = (i) => {
    const fileIndex = currentAlbumIndex === 0 ? i : i + 8; 
    const id = fileIds[lang][fileIndex];
    return `https://github.com/user-attachments/files/${id}/${lang}-${pad(fileIndex)}.mp3`;
  };
  
  const coverPath = (i) => {
    const fileNum = currentAlbumIndex === 0 ? pad(i) : pad(i + 8);
    return `covers/${lang}/${fileNum}.jpg`;
  };
  
  const trackName = (t) => lang === 'ru' ? t.ru : t.en;

  function renderCarousel(){
    carousel.innerHTML = '';
    getAlbum().tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      const trackLabel = lang === 'en' ? `TRACK #${i+1}` : `ТРЕК №${i+1}`;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(i)}" alt="${trackName(t)}">
        <div class="track__num">${trackLabel}</div>
        <div class="track__name">${trackName(t)}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function updateAlbumHeader() {
    const album = getAlbum();
    albumCover.src = album.cover;
    albumTitle.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
    albumSub.textContent = lang === 'ru' ? album.titleEn : album.titleRu;
    playerArtist.textContent = `${lang === 'en' ? album.titleEn : album.titleRu} / ${lang === 'en' ? album.titleRu : album.titleEn}`;
  }

  function resetPlayer() {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    currentTrack = -1; playerCover.src = getAlbum().cover;
    playerTitle.textContent = lang === 'en' ? 'Pick a song' : 'Выбери песню';
  }

  function play(i){
    if (i < 0) i = getAlbum().tracks.length - 1;
    if (i >= getAlbum().tracks.length) i = 0;

    currentTrack = i;
    const t = getAlbum().tracks[i];

    playerCover.src = coverPath(i);
    if (lang === 'en') { playerTitle.innerHTML = `${t.en}<span class="lang-sub">${t.ru}</span>`; } 
    else { playerTitle.innerHTML = `${t.ru}<span class="lang-sub">${t.en}</span>`; }

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(i);
    audio.play().catch(()=>{});
  }

  function setLang(newLang){
    if (lang === newLang) return;
    const wasPlaying = !audio.paused;
    lang = newLang;

    btnRu.classList.toggle('active', lang === 'ru');
    btnEn.classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;

    updateAlbumHeader(); renderCarousel();
    document.getElementById('prevBtn').textContent = lang === 'en' ? '⏮ Prev' : '⏮ Пред';
    document.getElementById('nextBtn').textContent = lang === 'en' ? 'Next ⏭' : 'След ⏭';

    if (currentTrack >= 0){
      const t = getAlbum().tracks[currentTrack];
      const time = audio.currentTime;
      playerCover.src = coverPath(currentTrack);
      if (lang === 'en') { playerTitle.innerHTML = `${t.en}<span class="lang-sub">${t.ru}</span>`; } 
      else { playerTitle.innerHTML = `${t.ru}<span class="lang-sub">${t.en}</span>`; }
      audio.src = songPath(currentTrack);
      audio.currentTime = time;
      if (wasPlaying) audio.play().catch(()=>{});
    } else {
      playerTitle.textContent = lang === 'en' ? 'Pick a song' : 'Выбери песню';
    }
  }

  function switchAlbum(index) {
    if (currentAlbumIndex === index) return;
    currentAlbumIndex = index;
    
    if (albums[index].theme) { document.body.classList.add(albums[index].theme); } 
    else { albums.forEach(a => { if(a.theme) document.body.classList.remove(a.theme); }); }
    
    [...albumsNav.children].forEach((btn, i) => btn.classList.toggle('active', i === index));
    resetPlayer(); updateAlbumHeader(); renderCarousel();
    carousel.scrollTo({ left: 0, behavior: 'smooth' });
  }

  btnRu.addEventListener('click', () => setLang('ru'));
  btnEn.addEventListener('click', () => setLang('en'));
  [...albumsNav.children].forEach((btn, index) => { btn.addEventListener('click', () => switchAlbum(index)); });
  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  setLang('en'); updateAlbumHeader(); renderCarousel();
</script>
</body>
</html>
